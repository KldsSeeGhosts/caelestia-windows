# All recursive dependency sources are publicly accessible at their pinned refs.
name: Windows build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Fast regressions
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      native: ${{ steps.changes.outputs.native }}
    steps:
      - name: Checkout public sources
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Determine native build scope
        id: changes
        shell: pwsh
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          & .\windows\ci\Get-NativeBuildRequired.ps1 -Base $env:CHANGE_BASE
      - name: Source, lifecycle, quota and JavaScript regressions
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -NonInteractive -File windows/scripts/Test-Validation.ps1 `
            -Suite Unit -Python python -OutputRoot "$env:RUNNER_TEMP\validation-unit"
          if ($LASTEXITCODE -ne 0) { throw 'Fast regressions failed.' }
      - name: Sanitized test summary
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: unit-summary-${{ github.run_id }}
          path: ${{ runner.temp }}/validation-unit/summary.json
          if-no-files-found: ignore
          retention-days: 3

  packaging:
    name: Installer and colour regressions
    needs: checks
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout public sources
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Installer, rollback and scheme-generation contracts
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -NonInteractive -File windows/scripts/Test-Validation.ps1 `
            -Suite Packaging -OutputRoot "$env:RUNNER_TEMP\validation-packaging"
          if ($LASTEXITCODE -ne 0) { throw 'Installer regressions failed.' }
      - name: Prepare isolated colour-test dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $venv = "$env:RUNNER_TEMP\colour-test-venv"
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { throw 'Colour-test environment creation failed.' }
          $python = "$venv\Scripts\python.exe"
          & $python -m pip install --disable-pip-version-check --no-deps --only-binary=:all: `
            --require-hashes -r windows/scripts/scheme/requirements.lock.txt
          if ($LASTEXITCODE -ne 0) { throw 'Locked colour dependencies failed.' }
          $lock = Get-Content windows/sources.lock.json -Raw | ConvertFrom-Json
          if ($lock.schemeCli.revision -notmatch '^[a-f0-9]{40}$') { throw 'Invalid colour CLI pin.' }
          & $python -m pip install --disable-pip-version-check --no-deps --ignore-requires-python `
            "git+https://github.com/caelestia-dots/cli@$($lock.schemeCli.revision)"
          if ($LASTEXITCODE -ne 0) { throw 'Pinned colour CLI installation failed.' }
      - name: Colour worker and wallpaper-input regressions
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -NonInteractive -File windows/scripts/Test-Validation.ps1 `
            -Suite Scheme -Python "$env:RUNNER_TEMP\colour-test-venv\Scripts\python.exe" `
            -OutputRoot "$env:RUNNER_TEMP\validation-scheme"
          if ($LASTEXITCODE -ne 0) { throw 'Colour regressions failed.' }
      - name: Sanitized test summaries
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: packaging-summary-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/validation-packaging/summary.json
            ${{ runner.temp }}/validation-scheme/summary.json
          if-no-files-found: ignore
          retention-days: 3

  build:
    name: Native build and offscreen regressions
    needs: checks
    if: needs.checks.outputs.native == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
        working-directory: C:\
    env:
      BUILD_ROOT: C:\b-public
      TOOL_ROOT: C:\t-public
      PIP_CACHE_DIR: C:\t-public\pip
      DIAGNOSTICS: C:\ci-public
      SMOKE_ROOT: C:\ci-public\smoke
      RUSTUP_TOOLCHAIN: stable-x86_64-pc-windows-msvc

    steps:
      - name: Checkout recursive sources
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive
          persist-credentials: false

      - name: Python 3.12
        id: python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
          architecture: x64

      - name: Restore versioned tooling
        id: tools
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          key: windows-x64-tools-v2-py${{ steps.python.outputs.python-version }}-cmake4.4.4-ninja1.13.2-aqt076e1659807d0b362a3ed684d54c2e9c775eb9c7-qt6.11.2-msvc2022-llvm20.1.8-cli11v2.5.0
          path: |
            C:\t-public\Qt
            C:\t-public\downloads
            C:\t-public\pip
            C:\t-public\clang+llvm-20.1.8-x86_64-pc-windows-msvc
            C:\t-public\deps\CLI11-2.5.0

      - name: Prepare pinned tooling
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path $env:TOOL_ROOT, "$env:TOOL_ROOT\downloads", $env:DIAGNOSTICS | Out-Null
          Start-Transcript -Path "$env:DIAGNOSTICS\prepare.log"
          try {
            Set-Location -LiteralPath $env:DIAGNOSTICS
            python -m venv "$env:TOOL_ROOT\tools"
            if ($LASTEXITCODE -ne 0) { throw 'Python environment creation failed.' }
            $python = "$env:TOOL_ROOT\tools\Scripts\python.exe"
            & $python -m pip install cmake==4.4.4 ninja==1.13.2 `
              'https://github.com/miurahr/aqtinstall/archive/076e1659807d0b362a3ed684d54c2e9c775eb9c7.zip'
            if ($LASTEXITCODE -ne 0) { throw 'Pinned Python tooling installation failed.' }

            $qt = "$env:TOOL_ROOT\Qt\6.11.2\msvc2022_64"
            if ('${{ steps.tools.outputs.cache-hit }}' -ne 'true') {
              & $python -m aqt install-qt windows desktop 6.11.2 win64_msvc2022_64 `
                -O "$env:TOOL_ROOT\Qt" --modules qtshadertools qtimageformats `
                --archives qtbase qtdeclarative qtsvg qttools
              if ($LASTEXITCODE -ne 0) { throw 'Qt installation failed.' }
            }
            foreach ($file in @('bin\qtpaths.exe', 'bin\windeployqt.exe', 'bin\Qt6Quick.dll',
                'bin\Qt6Svg.dll', 'bin\Qt6ShaderTools.dll', 'plugins\imageformats\qjpeg.dll')) {
              if (-not (Test-Path -LiteralPath "$qt\$file" -PathType Leaf)) {
                throw "Incomplete Qt tooling cache: $file"
              }
            }
            $qtVersion = & "$qt\bin\qtpaths.exe" --qt-version
            if ($LASTEXITCODE -ne 0 -or "$qtVersion".Trim() -ne '6.11.2') { throw 'Qt version mismatch.' }

            $llvmArchive = "$env:TOOL_ROOT\downloads\llvm-20.1.8.tar.xz"
            if (-not (Test-Path -LiteralPath $llvmArchive)) {
              curl.exe -L --fail --silent --show-error `
                'https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.8/clang+llvm-20.1.8-x86_64-pc-windows-msvc.tar.xz' `
                -o $llvmArchive
              if ($LASTEXITCODE -ne 0) { throw 'LLVM download failed.' }
            }
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath $llvmArchive).Hash -ne
                'f229769f11d6a6edc8ada599c0cda964b7dee6ab1a08c6cf9dd7f513e85b107f') {
              throw 'LLVM checksum mismatch.'
            }
            $clang = "$env:TOOL_ROOT\clang+llvm-20.1.8-x86_64-pc-windows-msvc\bin\clang-cl.exe"
            if (-not (Test-Path -LiteralPath $clang -PathType Leaf)) {
              & "$env:SystemRoot\System32\tar.exe" -xf $llvmArchive -C $env:TOOL_ROOT
              if ($LASTEXITCODE -ne 0) { throw 'LLVM extraction failed.' }
            }
            $clangVersion = & $clang --version
            if ($LASTEXITCODE -ne 0 -or "$clangVersion" -notmatch 'clang version 20\.1\.8\b') {
              throw 'LLVM tooling cache version mismatch.'
            }

            $cliArchive = "$env:TOOL_ROOT\downloads\cli11-v2.5.0.zip"
            if (-not (Test-Path -LiteralPath $cliArchive)) {
              curl.exe -L --fail --silent --show-error `
                'https://github.com/CLIUtils/CLI11/archive/refs/tags/v2.5.0.zip' -o $cliArchive
              if ($LASTEXITCODE -ne 0) { throw 'CLI11 download failed.' }
            }
            if ((Get-FileHash -Algorithm SHA256 -LiteralPath $cliArchive).Hash -ne
                '887270cae374a0b9e22b39647f9fc4bc742587fb26d6a221da2d2bbcf3109b0b') {
              throw 'CLI11 checksum mismatch.'
            }
            if (-not (Test-Path -LiteralPath "$env:TOOL_ROOT\deps\CLI11-2.5.0\include\CLI\CLI.hpp")) {
              Expand-Archive -LiteralPath $cliArchive -DestinationPath "$env:TOOL_ROOT\deps" -Force
            }
            rustc --version
            if ($LASTEXITCODE -ne 0) { throw 'The runner stable MSVC Rust toolchain is required.' }
            cargo --version
            if ($LASTEXITCODE -ne 0) { throw 'Cargo is required for bundled Glazier.' }
          } finally {
            Stop-Transcript
          }

      - name: Save tooling from trusted main only
        if: steps.tools.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          key: ${{ steps.tools.outputs.cache-primary-key }}
          path: |
            C:\t-public\Qt
            C:\t-public\downloads
            C:\t-public\pip
            C:\t-public\clang+llvm-20.1.8-x86_64-pc-windows-msvc
            C:\t-public\deps\CLI11-2.5.0

      - name: Service contracts before native compilation
        run: |
          & powershell.exe -NoProfile -NonInteractive -File "$env:GITHUB_WORKSPACE\windows\scripts\Test-Validation.ps1" `
            -Suite Services -BuildRoot $env:BUILD_ROOT `
            -QtPrefix "$env:TOOL_ROOT\Qt\6.11.2\msvc2022_64" -OutputRoot "$env:DIAGNOSTICS\Services"
          if ($LASTEXITCODE -ne 0) { throw 'Service regressions failed.' }

      - name: Build production payload
        run: |
          & powershell.exe -NoProfile -File "$env:GITHUB_WORKSPACE\windows\scripts\Build-Prototype.ps1" `
            -BuildRoot $env:BUILD_ROOT `
            -QtPrefix "$env:TOOL_ROOT\Qt\6.11.2\msvc2022_64" `
            -LlvmBin "$env:TOOL_ROOT\clang+llvm-20.1.8-x86_64-pc-windows-msvc\bin" `
            -Cli11Include "$env:TOOL_ROOT\deps\CLI11-2.5.0\include" `
            -ToolsBin "$env:TOOL_ROOT\tools\Scripts" `
            -PublicRelease `
            -PluginTests `
            2>&1 | Tee-Object -FilePath "$env:DIAGNOSTICS\build.log"
          if ($LASTEXITCODE -ne 0) { throw 'Build-Prototype failed.' }

      - name: Native plugin regressions
        run: |
          $qt = "$env:TOOL_ROOT\Qt\6.11.2\msvc2022_64"
          $env:PATH = "$qt\bin;$env:BUILD_ROOT\caelestia\lib;$env:PATH"
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:QT_QPA_PLATFORM_PLUGIN_PATH = "$qt\plugins\platforms"
          & "$env:TOOL_ROOT\tools\Scripts\ctest.exe" --test-dir "$env:BUILD_ROOT\caelestia" `
            --output-on-failure --timeout 60 --no-tests=error
          if ($LASTEXITCODE -ne 0) { throw 'Native plugin regressions failed.' }

      - name: Shell regressions
        run: |
          & powershell.exe -NoProfile -NonInteractive -File "$env:GITHUB_WORKSPACE\windows\scripts\Test-Validation.ps1" `
            -Suite Shell -BuildRoot $env:BUILD_ROOT -QtPrefix "$env:TOOL_ROOT\Qt\6.11.2\msvc2022_64" `
            -OutputRoot "$env:DIAGNOSTICS\Shell"
          if ($LASTEXITCODE -ne 0) { throw 'Shell regressions failed.' }

      - name: Offscreen production smoke
        run: |
          & powershell.exe -NoProfile -File "$env:GITHUB_WORKSPACE\windows\scripts\Test-Smoke.ps1" `
            -BuildRoot $env:BUILD_ROOT `
            -QtPrefix "$env:TOOL_ROOT\Qt\6.11.2\msvc2022_64" `
            -RunRoot $env:SMOKE_ROOT `
            2>&1 | Tee-Object -FilePath "$env:DIAGNOSTICS\smoke.log"
          if ($LASTEXITCODE -ne 0) { throw 'Test-Smoke failed.' }

      - name: Sanitized test summaries
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: offscreen-summary-${{ github.run_id }}
          path: |
            C:/ci-public/Services/summary.json
            C:/ci-public/Shell/summary.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Failure diagnostics only
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: windows-failure-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: ignore
          path: |
            ${{ env.DIAGNOSTICS }}/*.log
            C:/b-public/logs/

  validation:
    name: Windows validation
    if: always()
    needs: [checks, packaging, build]
    runs-on: windows-latest
    timeout-minutes: 2
    steps:
      - name: Require every applicable gate
        shell: pwsh
        env:
          CHECKS: ${{ needs.checks.result }}
          PACKAGING: ${{ needs.packaging.result }}
          BUILD: ${{ needs.build.result }}
          NATIVE_REQUIRED: ${{ needs.checks.outputs.native }}
        run: |
          if ($env:CHECKS -ne 'success' -or $env:PACKAGING -ne 'success') {
            throw 'Source or installer validation did not pass.'
          }
          if ($env:NATIVE_REQUIRED -notin @('true', 'false')) {
            throw 'The native-build decision is missing or invalid.'
          }
          if ($env:NATIVE_REQUIRED -eq 'true' -and $env:BUILD -ne 'success') {
            throw 'Required native validation did not pass.'
          }
          if ($env:NATIVE_REQUIRED -eq 'false' -and $env:BUILD -ne 'skipped') {
            throw 'Unexpected native-gate result.'
          }
