name: Windows bug report
description: Report a Windows port bug or crash
title: "[Windows bug] "
body:
  - type: textarea
    id: environment
    attributes:
      label: Windows and source versions
      description: Include Windows edition and build from winver, shell commit/release, backend pin and Qt version if known. Installed source details are in install.json and licenses/sources.lock.json.
      placeholder: "Windows 11 build ...; shell ...; backend ...; Qt ..."
    validations:
      required: true
  - type: textarea
    id: monitors
    attributes:
      label: Monitors and DPI
      description: List monitor count, resolutions, scaling percentages, primary monitor and layout (including negative origins). Note HDR, transparency and remote desktop use if relevant.
    validations:
      required: true
  - type: textarea
    id: integration
    attributes:
      label: Installation and desktop integration
      description: Source build or installed package? Default or custom profile? Which service controls, takeover, autostart and tiling options are enabled? List other running shells or tilers.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
      description: Include frequency, any crash or recovery behavior, and screenshots if helpful.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and diagnostics
      description: |
        Installed logs: %LOCALAPPDATA%\caelestia-windows\logs\shell.stdout.log and shell.stderr.log.
        Supervisor logs: <profile>\runtime\supervisor-<id>\. Custom profiles use their own paths.
        Source runs: windows\.local\build\logs\, shell-runs\, and harness validation directories.
        Attach relevant logs and result.json, or explain why unavailable. Redact private notification content, credentials and personal paths as needed.
        Optional read-only diagnostic: powershell -NoProfile -File windows/scripts/Get-DesktopState.ps1
